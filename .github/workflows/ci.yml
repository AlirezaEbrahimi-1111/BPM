name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 7.4 (matches production)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: pdo_sqlite, mbstring, curl, gd, zip, intl, xml, mysqli, pdo_mysql
          coverage: none

      - name: PHP syntax check (all files)
        run: find . -name "*.php" -not -path "./.git/*" -print0 | xargs -0 -n1 -P4 php -l

      # tests/config.php is gitignored (holds real credentials) and unconditionally
      # required by tests/run.php even in CLI mode. Unit tests don't touch base_url
      # or auth_token (only integration tests do), so a placeholder is enough here.
      - name: Create placeholder test config
        run: |
          cat > tests/config.php << 'EOF'
          <?php
          return [
              'base_url'   => 'http://localhost',
              'auth_token' => '',
              'run_secret' => 'ci-placeholder',
          ];
          EOF

      - name: Run unit tests
        run: php tests/run.php unit
