# این چند خط باید داخلِ همان <VirtualHost *:443> که برایِ itmalek.com هست
# اضافه شود (نه یک فایلِ vhostِ جدا). معمولاً:
#   /etc/apache2/sites-available/itmalek*.conf  یا  ...-le-ssl.conf
#
# پیش‌نیاز (یک‌بار):
#   sudo a2enmod proxy proxy_http
#   sudo systemctl reload apache2
#
# بعد از افزودنِ این بلوک:
#   sudo apachectl configtest      # باید بگوید Syntax OK
#   sudo systemctl reload apache2  # reload، نه restart — بدونِ قطعی

    # ── سرویسِ CRM (Go، پورتِ داخلیِ 8090) ──
    ProxyPreserveHost On
    ProxyPass        /crm/api/  http://127.0.0.1:8090/crm/api/
    ProxyPassReverse /crm/api/  http://127.0.0.1:8090/crm/api/

    # مسیرِ /crm/api/ فقط به سرویسِ Go می‌رود.
    # صفحاتِ فرانتِ CRM (بعداً، مثل /pages/crm/customers.php) عادی توسطِ PHP سرو می‌شوند.
