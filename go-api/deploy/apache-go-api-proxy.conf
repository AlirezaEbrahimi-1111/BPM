# این چند خط باید داخل همان <VirtualHost *:443> itmalek.com اضافه شود
# (کنار بلوک /crm/api/ که از قبل هست) — نه یک vhost جدا.
#   فایل معمولا: /etc/apache2/sites-available/itmalek.conf  (یا ...-le-ssl.conf)
#
# پیش‌نیاز (اگر قبلا برای crm فعال نشده): sudo a2enmod proxy proxy_http
#
# بعد از افزودن:
#   sudo apachectl configtest      # باید بگوید Syntax OK
#   sudo systemctl reload apache2  # reload، نه restart

    # ── go-api (Go، پورت داخلی 8091) ──
    ProxyPreserveHost On
    ProxyPass        /go/api/  http://127.0.0.1:8091/go/api/
    ProxyPassReverse /go/api/  http://127.0.0.1:8091/go/api/

    # مسیر /go/api/ فقط به سرویس Go می‌رود. بقیهٔ اپ دست‌نخورده روی PHP می‌ماند.
    # برگشت: کافی است همین سه خط را کامنت کنی و apache را reload کنی —
    #        بلافاصله همه‌چیز به PHP برمی‌گردد (endpointهای PHP حذف نشده‌اند).
