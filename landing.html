<!DOCTYPE html>
<!--
  صفحه‌ی اولِ دامنه‌ی اصلی itmalek.com (نه bpm.itmalek.com).
  مسیردهی: .htaccess برای میزبان itmalek.com مسیر «/» را به همین فایل می‌دهد و
  هر مسیر دیگر را به bpm.itmalek.com می‌فرستد.

  طرح: تصویرِ ۲:۱ (landing-bg.png) تمام‌صفحه؛ .stage دقیقاً هم‌اندازه‌ی تصویر
  است و محتوا با درصد (موقعیت) و cqw (اندازه — ۱cqw = ۱٪ عرضِ .stage)
  چیده شده، تا با هر اندازه‌ی پنجره روی همان کارت‌های داخلِ تصویر بماند.
-->
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کامپیوتر یکتا</title>
<link href="/assets/fonts/Vazirmatn-font-face.css" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  background: #04092a;   /* هم‌رنگِ لبه‌های تصویر — اگر جایی از تصویر بیرون ماند */
}

body {
  font-family: 'Vazirmatn', system-ui, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100dvh;
}

/* تصویر ۲:۱ تمام‌صفحه (مثل background-size: cover): .stage همیشه دست‌کم
   هم‌عرض و هم‌ارتفاعِ پنجره است و اضافه‌اش از دو طرف (یا بالا/پایین) بیرون
   می‌زند. چون محتوا داخلِ همین .stage با درصد چیده شده، همراهِ تصویر می‌ماند. */
.stage {
  position: relative;
  flex-shrink: 0;
  /* ×1.1 = حدود ۵٪ از هر طرف بیشتر از کاور بریده می‌شود (زومِ پس‌زمینه) */
  width: calc(max(100vw, 200dvh) * 1.1);
  aspect-ratio: 2 / 1;
  container-type: inline-size;
}

/* پس‌زمینه روی یک لایه‌ی جدا (::before) تا بشود قرینه‌اش کرد */
.stage::before {
  content: '';
  position: absolute;
  inset: 0;
  background: url('/assets/landing/landing-bg.png') center / 100% 100% no-repeat;
}

/* حالتِ قرینه (کلاسِ mirror روی .stage): تصویر افقی برعکس می‌شود و
   چون کامپیوتر به چپ می‌رود، بلوکِ فروشگاه به جای قرینه‌اش در راست می‌رود */
.stage.mirror::before { transform: scaleX(-1); }
.stage.mirror .block--store { left: auto; right: 24.4%; width: 21%; }  /* هم‌راستا با متنِ BPM */

/* صفحه‌های کم‌عرض‌تر (مثل ۵:۴): زوم کارتِ پایین (۲۱٪ تا ۷۹٪ عرضِ تصویر)
   را بیرون می‌انداخت — این‌جا فقط کاور، بدون زوم */
@media (max-aspect-ratio: 29/20) {
  .stage { width: max(100vw, 200dvh); }
}

/* صفحه‌های باریک (موبایلِ عمودی): کاور هم کارت را بیرون می‌انداخت —
   زیرِ نسبتِ ۶:۵ کلِ تصویر به عرضِ صفحه نشان داده می‌شود */
@media (max-aspect-ratio: 6/5) {
  .stage { width: 100vw; }
}

/* --u واحدِ اندازه‌ی هر بلوک است (بر حسبِ cqw = ٪ عرضِ .stage)؛
   همه‌ی اندازه‌های داخلِ بلوک ضریبی از آن‌اند */
.block {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: flex-start;   /* در RTL یعنی راست‌چین */
  text-align: right;
}

/* چیدمانِ ضربدری: بالا = فروشگاه (چپ) و کامپیوترِ تصویر (راست)؛
   پایین = داشبورد (چپِ کارت) و متنِ BPM (راستِ کارت).
   فروشگاه: لبه‌ی چپش هم‌راستای لبه‌ی چپِ کارت (۲۱.۶٪) و لبه‌ی راستش با
   فاصله از لپ‌تاپِ تصویر (۴۰٪)؛ از پایین به بالای
   کارت (۵۲٪) قفل است و رو به بالا رشد می‌کند تا بریدگیِ بالای تصویر فقط
   فضای خالیِ تیره را بخورد */
.block--store { --u: 0.46cqw; left: 21.6%; bottom: 50.5%; width: 18.4%; color: #ffffff; }
/* BPM: ستونِ راستِ کارتِ روشن */
.block--bpm   { --u: 0.44cqw; right: 24.4%; top: 60.5%; width: 21%; color: #1e1b3a; }

.store-logo {
  width: calc(var(--u) * 10);
  height: calc(var(--u) * 6.8);
  margin-bottom: calc(var(--u) * 2.4);
}

.store-logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: right center;
  display: block;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: calc(var(--u) * 0.8);
  font-size: calc(var(--u) * 1.5);
  font-weight: 700;
  margin-bottom: calc(var(--u) * 1);
}

.eyebrow::before {
  content: '';
  width: calc(var(--u) * 2.4);
  height: 2px;
  border-radius: 2px;
  background: currentColor;
}

.block--store .eyebrow { color: #b4a2ff; }
.block--bpm .eyebrow   { color: #10a87a; }

.title {
  font-weight: 800;
  line-height: 1.25;
}

.block--store .title { font-size: calc(var(--u) * 4.6); }
.block--bpm .title   { font-size: calc(var(--u) * 2.7); }

.subtitle {
  margin-top: calc(var(--u) * 1.4);
  font-weight: 500;
  line-height: 1.8;
}

.block--store .subtitle { font-size: calc(var(--u) * 1.7); color: #c9d2ec; }
.block--bpm .subtitle   { font-size: calc(var(--u) * 1.7); color: #5b6075; }

/* دکمه‌ها */
.cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: calc(var(--u) * 1.4);
  padding: 0 calc(var(--u) * 3);
  height: calc(var(--u) * 5);
  border-radius: calc(var(--u) * 1.2);
  font-size: calc(var(--u) * 1.6);
  font-weight: 700;
  color: #ffffff;
  text-decoration: none;
  transition: transform .2s, box-shadow .2s, filter .2s;
}

.cta svg { width: calc(var(--u) * 1.9); height: calc(var(--u) * 1.9); transition: transform .2s; }

.cta:hover { transform: translateY(-2px); filter: brightness(1.08); }
.cta:hover svg { transform: translateX(-3px); }
.cta:focus-visible { outline: 3px solid rgba(255,255,255,.7); outline-offset: 3px; }

.cta--store {
  margin-top: calc(var(--u) * 3.2);
  background: linear-gradient(90deg, #4f46e5, #8b3dff);
  box-shadow: 0 0 calc(var(--u) * 2.2) rgba(139, 61, 255, .5);
}

.cta--bpm {
  margin-top: calc(var(--u) * 3.2);
  background: linear-gradient(90deg, #22c79a, #0fa47a);
  box-shadow: 0 calc(var(--u) * 0.8) calc(var(--u) * 2) rgba(16, 185, 129, .32);
}

.cta--bpm:focus-visible { outline-color: rgba(16, 185, 129, .6); }

/* امکانات: چیپ‌های افقیِ کوچک (آیکون + برچسب) */
.features {
  display: flex;
  flex-wrap: wrap;
  gap: calc(var(--u) * 1);
  margin-top: calc(var(--u) * 2.8);
}

.feature {
  display: inline-flex;
  align-items: center;
  gap: calc(var(--u) * 0.6);
  padding: calc(var(--u) * 0.55) calc(var(--u) * 1.1);
  border-radius: 999px;
  font-size: calc(var(--u) * 1.2);
  font-weight: 600;
  white-space: nowrap;
}

.feature svg {
  width: calc(var(--u) * 1.8);
  height: calc(var(--u) * 1.8);
  fill: none;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.block--store .feature {
  color: #e6e9f5;
  background: rgba(255, 255, 255, .06);
  border: 1px solid rgba(167, 139, 250, .28);
}
.block--store .feature svg { stroke: url(#gradStore); }

.block--bpm .feature {
  color: #2b2f45;
  background: rgba(16, 185, 129, .07);
  border: 1px solid rgba(16, 185, 129, .22);
}
.block--bpm .feature svg { stroke: #14a37c; }

/* لوگوی BPM داخلِ دایره‌ی سفیدِ وسطِ تصویر */
.bpm-logo {
  position: absolute;
  left: 50.05%;
  top: 54.1%;
  width: 2.5cqw;
  transform: translate(-50%, -50%);
  display: block;
}

/* تصویرِ داشبورد: ستونِ چپِ کارت، با کمی چرخشِ سه‌بعدی رو به متنِ BPM؛
   با hover صاف می‌شود. کادرِ شیشه‌ای با کد (padding + پس‌زمینه‌ی خودِ img)،
   تا همیشه دقیقاً هم‌اندازه‌ی خودِ عکس باشد */
.dashboard {
  position: absolute;
  left: 23.2%;
  top: 58.2%;
  width: 26.4%;
  height: 30.6%;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  direction: ltr;            /* تا flex-start یعنی «چپ» (نه راستِ RTL) */
  perspective: 120cqw;
}

.dashboard img {
  max-width: 100%;
  max-height: 100%;
  display: block;
  padding: 0.6cqw;
  background: rgba(244, 246, 255, .8);
  border: 1px solid rgba(255, 255, 255, .9);
  border-radius: 1cqw;
  box-shadow:
    -1cqw 1.2cqw 2.4cqw rgba(60, 50, 140, .2),
    inset 0 0 0 1px rgba(255, 255, 255, .5);
  transform: rotateY(12deg);
  transform-origin: left center;
  transition: transform .6s cubic-bezier(.16, 1, .3, 1);
}

.dashboard:hover img { transform: rotateY(0deg); }
</style>
</head>
<body>

<!-- گرادیانِ آیکون‌های کارتِ فروشگاه (بنفش → آبی) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gradStore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
</svg>

<main class="stage mirror" id="main-content">

  <!-- ===== کارتِ بالا: فروشگاه ===== -->
  <section class="block block--store" aria-label="فروشگاه کامپیوتر یکتا">
    <div class="store-logo"><img src="/assets/landing/logo.png" alt="لوگوی کامپیوتر یکتا" onerror="this.remove()"></div>
    <span class="eyebrow">فروشگاه</span>
    <h1 class="title">کامپیوتر یکتا</h1>
    <p class="subtitle">سیستم های گیمینگ و قطعات سخت افزاری</p>
    <a class="cta cta--store" href="https://computeryekta.com">
      ورود به فروشگاه
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>
    <div class="features">
      <div class="feature">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="13.5" width="4" height="6" rx="1.6"/><rect x="17.5" y="13.5" width="4" height="6" rx="1.6"/><path d="M19.5 19.5c0 1.5-2 2.5-5 2.5"/></svg>
        پشتیبانی تخصصی
      </div>
      <div class="feature">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 6h11v10H2z"/><path d="M13 9h4.5l3.5 3.5V16h-8"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/><line x1="0.8" y1="9" x2="4" y2="9"/><line x1="0.8" y1="12" x2="3" y2="12"/></svg>
        ارسال سریع
      </div>
      <div class="feature">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l8 3v6c0 5.2-3.4 8.6-8 10-4.6-1.4-8-4.8-8-10v-6z"/><polyline points="8.5 12 11 14.5 15.5 10"/></svg>
        گارانتی معتبر
      </div>
    </div>
  </section>

  <!-- ===== کارتِ پایین: BPM ===== -->
  <section class="block block--bpm" aria-label="سامانه مدیریت فرآیند کسب و کار">
    <span class="eyebrow">سامانه</span>
    <h2 class="title">سامانه مدیریت فرآیند کسب‌و‌کار (BPM)</h2>
    <p class="subtitle">مدیریت هوشمند فرآیند ها</p>
    <a class="cta cta--bpm" href="https://bpm.itmalek.com">
      ورود به سامانه
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>
    <div class="features">
      <div class="feature">
        <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="3" y1="21" x2="21" y2="21"/><rect x="5" y="12" width="3.2" height="7" rx=".6"/><rect x="10.4" y="8" width="3.2" height="11" rx=".6"/><rect x="15.8" y="4" width="3.2" height="15" rx=".6"/></svg>
        گزارش گیری پیشرفته
      </div>
      <div class="feature">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 0 1-13.7 5.6"/><path d="M4 12a8 8 0 0 1 13.7-5.6"/><polyline points="18 2.5 18 6.5 14 6.5"/><polyline points="6 21.5 6 17.5 10 17.5"/><circle cx="12" cy="12" r="2.6"/></svg>
        اتوماسیون فرآیندها
      </div>
      <div class="feature">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
        نظارت لحظه ای
      </div>
    </div>
  </section>

  <img class="bpm-logo" src="/assets/landing/bpm-logo.png" alt="لوگوی BPM">

  <!-- تصویرِ داشبورد: ستونِ چپِ کارتِ روشن -->
  <div class="dashboard"><img src="/assets/landing/dashboard.png" alt="نمایی از داشبورد سامانه BPM" onerror="this.remove()"></div>

</main>

</body>
</html>
